name: tag and push image

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      build-context:
        required: true
        default: .
        type: string
      dockerfile-path:
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
       required: true
      DOCKERHUB_USERNAME:
       required: true

permissions:
 contents: write
      
      
jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch git tags
        run: git fetch --tags

      - name: Decide version bump
        id: version
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"

          SHOULD_TAG=false

          if [[ "$SOURCE_BRANCH" == "hotfix" && "$TARGET_BRANCH" == "release" ]]; then
            PATCH=$((PATCH + 1))
            SHOULD_TAG=true
          elif [[ "$SOURCE_BRANCH" == "main" && "$TARGET_BRANCH" == "release" ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            SHOULD_TAG=true
          fi

          if [[ "$SHOULD_TAG" == "true" ]]; then
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            echo "new_tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "latest_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Push Git tag
        if: steps.version.outputs.new_tag != ''
        run: |
          git config user.name "riti-bhandari"
          git config user.email "ritibhandari16@gmail.com"
          git tag -a "${{ steps.version.outputs.new_tag }}" -m "Release ${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image
        if: steps.version.outputs.new_tag != ''
        run: |
          docker build \
            -t ${{ inputs.image-name }}:${{ steps.version.outputs.latest_version }} \
            -f ${{ inputs.dockerfile-path }} \
            ${{ inputs.build-context }}

          docker push ${{ inputs.image-name }}:${{ steps.version.outputs.latest_version }}


          
