name: Build and scan docker image

on: 
 workflow_call:
   inputs:
     build-context: 
       required: true
       default: .
       type: string
     image-name: 
       required: true
       type: string
     image-tag:
       required: true
       type: string
     dockerfile-path:
       required: true
       default: .
       type: string         

jobs:
  docker-build-scan:
    name: build image and scan
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
            fetch-depth: 0
      - name: build image
        run: docker build -t ${{inputs.image-name}}:${{inputs.image-tag}} -f ${{ inputs.dockerfile-path}} \
             ${{ inputs.build-context }}
      - name: scan job
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ inputs.image-name }}:${{ inputs.image-tag }}
          exit-code: 1
          severity: HIGH, CRITICAL
          

          
      
   
